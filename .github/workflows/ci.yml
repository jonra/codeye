name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test — fresh session
        run: npm run test:fresh

      - name: Smoke test — normal session (42% context)
        run: npm run test:mock

      - name: Smoke test — critical context (87%)
        run: npm run test:critical

      - name: Smoke test — high cost ($3.47)
        run: npm run test:expensive

      - name: Verify dist is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/ is out of date — run npm run build and commit" && exit 1)
